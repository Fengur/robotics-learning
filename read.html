<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读 · 机器人学习</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --ink:#e6e9ef; --ink2:#a5adba; --ink3:#6b7280;
    --accent:#7c9cff; --accent2:#5eead4; --hist:#c084fc;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f6f7f9; --panel:#ffffff; --panel2:#f0f2f5; --border:#e4e7ec;
      --ink:#1a1d23; --ink2:#4b5563; --ink3:#8a92a0;
      --accent:#4f6cf7; --accent2:#0ea5a3; --hist:#9333ea;
    }
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.75; -webkit-font-smoothing:antialiased;}
  .bar{position:sticky; top:0; z-index:10; background:color-mix(in srgb,var(--bg) 88%,transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--border)}
  .bar .inner{max-width:820px; margin:0 auto; padding:12px 24px; display:flex; align-items:center; gap:14px}
  .back{font-size:14px; color:var(--accent); text-decoration:none; font-weight:600}
  .back:hover{text-decoration:underline}
  .crumb{font-size:13px; color:var(--ink3)}
  .doc{max-width:820px; margin:0 auto; padding:36px 24px 90px}
  .doc h1{font-size:28px; margin:.2em 0 .5em; letter-spacing:-.01em}
  .doc h2{font-size:21px; margin:1.6em 0 .5em; padding-bottom:.3em; border-bottom:1px solid var(--border)}
  .doc h3{font-size:17px; margin:1.3em 0 .4em; color:var(--accent2)}
  .doc p,.doc li{color:var(--ink); font-size:15.5px}
  .doc blockquote{margin:1em 0; padding:.6em 1.1em; border-left:3px solid var(--accent2); background:var(--panel); border-radius:0 8px 8px 0; color:var(--ink2)}
  .doc code{background:var(--panel2); padding:.15em .45em; border-radius:5px; font-size:.88em; font-family:"SF Mono",Menlo,Consolas,monospace}
  .doc pre{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; overflow:auto}
  .doc pre code{background:none; padding:0}
  .doc table{border-collapse:collapse; width:100%; margin:1.2em 0; font-size:14px; display:block; overflow-x:auto}
  .doc th,.doc td{border:1px solid var(--border); padding:9px 12px; text-align:left}
  .doc th{background:var(--panel); font-weight:600}
  .doc tr:nth-child(even) td{background:color-mix(in srgb,var(--panel) 50%,transparent)}
  .doc a{color:var(--accent)}
  .doc input[type=checkbox]{width:16px; height:16px; margin-right:6px; vertical-align:-2px}
  .doc hr{border:none; border-top:1px solid var(--border); margin:2em 0}
  .err{max-width:820px; margin:60px auto; padding:0 24px; color:var(--ink2)}
  .err code{background:var(--panel2); padding:.15em .45em; border-radius:5px}
  /* mermaid 图容器 */
  .doc .mermaid{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px; margin:1.4em 0; text-align:center; overflow-x:auto}
  .doc .mermaid svg{max-width:100%; height:auto}
  .mermaid-err{background:var(--panel); border:1px solid var(--border); border-left:3px solid #ef4444; border-radius:0 8px 8px 0; padding:12px 14px; margin:1.2em 0; font-size:13px; color:var(--ink2)}
</style>
</head>
<body>
  <div class="bar"><div class="inner">
    <a class="back" href="index.html">← 返回门户</a>
    <span class="crumb" id="crumb"></span>
  </div></div>
  <article class="doc" id="doc"></article>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
// fengur START
(function(){
  const p = new URLSearchParams(location.search);
  let doc = p.get('doc') || '';
  const docEl = document.getElementById('doc');
  const crumbEl = document.getElementById('crumb');

  // 安全：仅允许本仓库内的相对 .md 路径，挡掉协议/绝对/越级
  const ok = doc && doc.endsWith('.md') && !/^([a-z]+:)?\/\//i.test(doc) && !doc.startsWith('/') && !doc.includes('..');
  if(!ok){ showErr('无效的文档路径。'); return; }
  crumbEl.textContent = doc;
  document.title = doc.replace(/\.md$/,'') + ' · 机器人学习';

  // 深浅色跟随系统，初始化 mermaid
  const darkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  if(window.mermaid){
    mermaid.initialize({ startOnLoad:false, theme: darkMode?'dark':'default', securityLevel:'strict', flowchart:{useMaxWidth:true}, sequence:{useMaxWidth:true} });
  }

  fetch(encodeURI(doc))
    .then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(md=>{
      if(window.marked){
        marked.setOptions({gfm:true, breaks:false});
        docEl.innerHTML = marked.parse(md);
      }else{
        docEl.innerHTML = '<pre>'+esc(md)+'</pre>';
      }
      renderMermaid();
    })
    .catch(e=>{
      showErr('无法加载 <code>'+doc+'</code>（'+e.message+'）。<br><br>' +
        '若在本地用 <code>file://</code> 双击打开，浏览器会拦截本地文件读取。<br>' +
        '在线（GitHub Pages）访问一切正常；本地想读 md 直接用编辑器打开即可。');
    });

  // 把 marked 生成的 ```mermaid 代码块转成 mermaid 容器再渲染
  function renderMermaid(){
    if(!window.mermaid) return;
    const blocks = docEl.querySelectorAll('pre > code.language-mermaid, pre > code.lang-mermaid');
    blocks.forEach(code=>{
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    try{
      mermaid.run({ querySelector:'.doc .mermaid' });
    }catch(err){
      docEl.querySelectorAll('.doc .mermaid').forEach(el=>{
        if(!el.querySelector('svg')){
          const w=document.createElement('div'); w.className='mermaid-err';
          w.textContent='（此图渲染失败，源码保留在下方）'; el.after(w);
        }
      });
    }
  }

  function esc(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function showErr(html){ docEl.innerHTML = '<div class="err">'+html+' <br><br><a class="back" href="index.html">← 返回门户</a></div>'; }
})();
// fengur END
</script>
</body>
</html>
